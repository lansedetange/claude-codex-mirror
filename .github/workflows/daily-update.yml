name: Daily Update

on:
  schedule:
    # 每天 UTC 03:00（北京时间 11:00）执行
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "强制重新下载并归档（即使版本未变）"
        type: boolean
        default: false
      only:
        description: "仅同步指定 source id（claude-mac / claude-win / codex-mac-arm / codex-mac-x64）"
        type: string

concurrency:
  group: daily-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install p7zip (extracts Info.plist from .dmg)
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - run: npm ci

      - name: Run update
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CF_PAGES_DEPLOY_HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          ARGS=()
          if [ "${{ inputs.force }}" = "true" ]; then ARGS+=(--force); fi
          if [ -n "${{ inputs.only }}" ]; then ARGS+=(--only "${{ inputs.only }}"); fi
          npm run update -- "${ARGS[@]}"

      - name: Commit manifest changes
        run: |
          if [ -n "$(git status --porcelain manifest.json)" ]; then
            git config user.name "mirror-bot"
            git config user.email "mirror-bot@users.noreply.github.com"
            git add manifest.json
            git commit -m "chore(manifest): daily sync $(date -u +%Y-%m-%d)"
            git push
          else
            echo "manifest.json unchanged."
          fi
